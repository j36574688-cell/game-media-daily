name: Clear all repository files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove all repository files
        run: |
          echo "開始清空 Repository..."

          git rm -r --ignore-unmatch .

          # 刪除隱藏檔案與 .github 內容
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "Repository 已清空"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository 已經是空的"
            exit 0
          fi

          git commit -m "Clear all repository files"
          git push
