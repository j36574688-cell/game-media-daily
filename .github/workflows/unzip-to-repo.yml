name: Import project from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 找不到 ZIP 檔案"
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          mkdir -p .unzip_temp

          unzip -o "$ZIP_FILE" -d .unzip_temp

          echo "✅ ZIP 解壓完成"

      - name: Detect project root
        run: |
          echo "解壓後目錄："
          find .unzip_temp -maxdepth 2 -type f | sort | head -100

      - name: Copy project to repository root
        run: |
          ROOT=".unzip_temp"

          DIRS=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)

          # ZIP 如果只有一層專案資料夾，就自動進入
          if [ "$DIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          echo "專案根目錄：$ROOT"

          # 複製一般檔案 + 隱藏檔案
          cp -a "$ROOT"/. ./

          echo "✅ 專案已複製到 Repository 根目錄"

      - name: Remove ZIP and temporary files
        run: |
          rm -rf .unzip_temp

          find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -delete

          echo "✅ ZIP 與暫存資料已刪除"

      - name: Remove old unzip workflow
        run: |
          rm -f .github/workflows/unzip-to-repo.yml

          echo "✅ 移除解壓 Workflow"

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "沒有新的變更"
            exit 0
          fi

          git commit -m "Import project from ZIP"

          git push
