name: Unzip Project to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 ZIP 檔案"
            exit 1
          fi

          echo "找到：$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          mkdir -p .unzip_temp
          unzip -o "$ZIP_FILE" -d .unzip_temp

          echo "解壓完成"

      - name: Detect project root
        run: |
          echo "解壓後內容："
          find .unzip_temp -maxdepth 3 -type f | head -100

      - name: Copy project files
        run: |
          ROOT=".unzip_temp"

          # 如果 ZIP 裡面只有一層資料夾，例如
          # game-media-daily-github/
          # 就進入該資料夾
          DIRS=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$DIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          echo "專案根目錄：$ROOT"

          # 複製所有檔案，包括隱藏檔
          cp -a "$ROOT"/. ./

      - name: Remove ZIP and temporary files
        run: |
          rm -rf .unzip_temp
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "沒有新的變更"
            exit 0
          fi

          git commit -m "Import project from ZIP"
          git push
